name: Build APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # JDK 21, not 17: compileSdk 36 / Robolectric needs it. Verified on this repo.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tests are informational only - they must never block the release APK.
      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Report test failures
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import glob, re
          out = []
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              t = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase[^>]*name="([^"]*)"[^>]*>(.*?)</testcase>', t, re.S):
                  if '<failure' in m.group(2) or '<error' in m.group(2):
                      body = re.sub(r'<[^>]+>', ' ', m.group(2))
                      out.append(m.group(1) + ' :: ' + ' '.join(body.split())[:1000])
          for line in out[:20]:
              print('::warning title=TestFailure::' + line.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          EOF

      # The build never short-circuits: if it fails we still get a chance to read WHY from
      # the annotations, instead of only "exit code 1" with a log that needs a browser login.
      - name: Build Release APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleRelease assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/gradle.log

      - name: Surface the real error
        if: always()
        continue-on-error: true
        run: |
          set -u
          LOG=/tmp/gradle.log
          if [ ! -f "$LOG" ]; then
            echo "::error title=BuildLogMissing::Gradle produced no log at $LOG"
            exit 0
          fi

          {
            echo "## Gradle build output"
            echo '```'
            tail -n 120 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Kotlin compiler errors ("e: file:///...kt:12:5 ..."), plus Gradle failure headers.
          grep -E '^e: file://|^e: |^FAILURE:|^\* What went wrong:|^Execution failed for task|> [A-Z][a-z]+ error:|error: ' "$LOG" \
            | sort -u | head -40 > /tmp/errs.txt || true

          if [ -s /tmp/errs.txt ]; then
            echo "::error title=GradleBuildFailed::$(wc -l < /tmp/errs.txt) error line(s) - see step summary"
            while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error file=build.gradle.kts,title=BuildError::${esc:0:900}"
            done < /tmp/errs.txt
          elif grep -q 'BUILD SUCCESSFUL' "$LOG"; then
            echo "::notice title=BuildOK::assembleRelease and assembleDebug both succeeded"
          else
            echo "::error title=BuildFailedUnknown::Build failed but no compiler/Gradle error line matched; see step summary"
            tail -n 30 "$LOG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | head -30
          fi

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
