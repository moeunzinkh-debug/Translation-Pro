name: Build APK
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tests are informational only - they must never block the release APK.
      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Report test failures
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import glob, re
          out = []
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              t = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase[^>]*name="([^"]*)"[^>]*>(.*?)</testcase>', t, re.S):
                  if '<failure' in m.group(2) or '<error' in m.group(2):
                      body = re.sub(r'<[^>]+>', ' ', m.group(2))
                      out.append(m.group(1) + ' :: ' + ' '.join(body.split())[:1000])
          for line in out[:20]:
              print('::warning title=TestFailure::' + line.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
