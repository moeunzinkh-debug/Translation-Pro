name: Build APK
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Show failing test details
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, os
          out = []
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              t = open(f, encoding='utf-8', errors='replace').read()
              for m in re.finditer(r'<testcase[^>]*name="([^"]*)"[^>]*>(.*?)</testcase>', t, re.S):
                  if '<failure' in m.group(2) or '<error' in m.group(2):
                      body = re.sub(r'<[^>]+>', ' ', m.group(2))
                      out.append(m.group(1) + ' :: ' + ' '.join(body.split())[:1200])
          for f in glob.glob('**/compile*.txt', recursive=True):
              out.append(open(f, errors='replace').read()[:1500])
          if not out:
              out = ['No parsed test failures found - likely a COMPILATION error. See raw log.']
          for line in out[:20]:
              print('::error title=TestFailure::' + line.replace('%','%25').replace('\r','').replace('\n','%0A'))
          EOF
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
